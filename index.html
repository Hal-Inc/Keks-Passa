  <style>
    :root{--ink:#111713;--ink2:#1b241e;--panel:#202a23;--panel2:#28342b;--paper:#f0eddf;--muted:#b4b8a7;--red:#f04432;--yellow:#f4ce46;--green:#9ac57b;--line:#3c493e;--display:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;--body:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 1px 1px,rgba(240,237,223,.055) 1px,transparent 0);background-size:5px 5px}button,input,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}a{color:inherit}
    .site-header{position:sticky;top:0;z-index:1000;background:rgba(17,23,19,.96);border-bottom:2px solid var(--red);backdrop-filter:blur(12px)}.header-inner{max-width:1600px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px;min-width:0;text-decoration:none}
    .brand-stamp{display:grid;place-items:center;width:52px;height:52px;flex:0 0 52px;background:var(--red);color:var(--ink);font:900 24px/1 var(--display);letter-spacing:-1.5px;transform:rotate(-4deg);border:2px solid var(--paper);box-shadow:4px 4px 0 var(--yellow)}
    .brand-name{display:block;font:900 clamp(27px,3.1vw,39px)/.85 var(--display);text-transform:uppercase;letter-spacing:-.5px}.brand-line{display:block;color:var(--yellow);font:500 10px/1.6 var(--mono);text-transform:uppercase;letter-spacing:1.2px;margin-top:5px}.header-note{text-align:right;color:var(--muted);font:11px/1.6 var(--mono);text-transform:uppercase}.header-note strong{color:var(--green);font-weight:500}
    main{width:min(1600px,100%);margin:0 auto;padding:26px 22px 48px}.hero{position:relative;overflow:hidden;padding:clamp(24px,4vw,52px);background:var(--red);color:var(--ink);border:2px solid var(--paper);box-shadow:8px 8px 0 var(--yellow)}.hero-topline{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:1.2px}.hero h1{position:relative;z-index:1;margin:12px 0 0;font:900 clamp(68px,11.2vw,160px)/.78 var(--display);letter-spacing:-.045em;text-transform:uppercase}.hero h1 span{color:var(--paper);-webkit-text-stroke:1px var(--ink);text-shadow:5px 5px 0 var(--ink)}.hero-bottom{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-top:26px}.hero-copy{max-width:520px;margin:0;font-size:clamp(14px,1.35vw,18px);font-weight:600;line-height:1.5}.hero-count{display:flex;flex-direction:column;align-items:flex-end;min-width:125px}.hero-count strong{font:900 42px/.9 var(--display)}.hero-count span{margin-top:8px;font:500 10px/1.6 var(--mono);text-align:right;text-transform:uppercase}
    
    /* Interactive Draggable Marquee Ticker (1200s slow scroll) */
    .ticker-wrap{overflow:hidden;width:100%;background:var(--ink2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:10px 0 18px;cursor:grab;user-select:none;-webkit-user-select:none}
    .ticker-wrap:active{cursor:grabbing}
    .ticker{display:flex;width:max-content;animation:tickerScroll 1200s linear infinite;color:var(--yellow);font:700 12px var(--mono);text-transform:none;letter-spacing:.5px;will-change:transform}
    .ticker.is-dragging{animation-play-state:paused!important;cursor:grabbing}
    .ticker:hover{animation-play-state:paused}
    .ticker span{display:inline-flex;align-items:center;padding-right:24px;pointer-events:none}
    .ticker span:nth-child(even){color:var(--red)}
    @keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    @media(max-width:900px){
      .ticker{animation-duration:1200s}
    }

    .toolbar{margin:10px 0 18px;padding:17px;background:var(--ink2);border:1px solid var(--line)}.filters{display:grid;grid-template-columns:1.25fr 1fr .8fr 1fr;gap:12px}.field label{display:block;margin-bottom:7px;color:var(--green);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.6px}.field input,.field select{width:100%;min-height:43px;padding:10px 12px;border:1px solid #526052;border-radius:0;background:var(--ink);color:var(--paper);outline:none;font-size:13px}.field input::placeholder{color:#879084}.field input:focus,.field select:focus{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}.toolbar-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:13px;padding-top:12px;color:var(--muted);font:11px/1.4 var(--mono)}.toolbar-bottom strong{color:var(--green);font-weight:500}.text-button{border:0;background:none;padding:3px 0;color:var(--yellow);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:500 11px var(--mono)}.map-toggle{display:none;border:1px solid var(--yellow);background:var(--yellow);color:var(--ink);padding:11px 14px;width:100%;margin-bottom:12px;text-transform:uppercase;font:800 15px var(--display);cursor:pointer}
    
    /* Layout with matching isolated scrollable panels */
    .content-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(350px,.92fr);align-items:start;gap:20px}
    .map-panel{position:sticky;top:86px;background:var(--ink2);border:1px solid var(--line);padding:8px}
    #map{width:100%;height:min(72vh,740px);min-height:450px;background:#26362d;z-index:1;filter:saturate(.82) contrast(1.02)}
    .map-caption{display:flex;justify-content:space-between;gap:10px;padding:10px 5px 3px;color:var(--muted);font:10px/1.5 var(--mono)}.map-caption span:first-child{color:var(--paper)}
    
    .events-column{min-width:0;position:sticky;top:86px}
    .list-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--yellow)}
    .list-heading h2{margin:0;font:800 26px var(--display);text-transform:uppercase;letter-spacing:.2px}
    .list-heading span{color:var(--green);font:500 10px var(--mono);text-align:right}
    
    /* Isolated scrollable events window */
    #events-card-list{max-height:min(72vh,740px);overflow-y:auto;overscroll-behavior:contain;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--yellow) var(--ink2)}
    #events-card-list::-webkit-scrollbar{width:6px}
    #events-card-list::-webkit-scrollbar-track{background:var(--ink2)}
