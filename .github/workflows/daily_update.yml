name: Atualizar eventos do Keks Passa

on:
  schedule:
    - cron: '5 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily_update.yml'
      - 'scraper.py'
      - 'locations.py'
      - 'venues.json'
      - 'verify_venues.py'

permissions:
  contents: write

concurrency:
  group: keks-passa-daily-refresh
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restaurar cache diária de tiers (tier_cache.json)
        uses: actions/cache@v4
        with:
          path: tier_cache.json
          key: keks-tier-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            keks-tier-cache-${{ runner.os }}-

      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests curl_cffi beautifulsoup4 lxml certifi tzdata

      - name: Sincronizar sugestões e auditar espaços (venues.json)
        run: python verify_venues.py --sync-suggestions --strict

      - name: Recolher eventos para hoje
        run: python scraper.py

      - name: Validar events.json antes de publicar
        run: |
          python -c "
          import json, scraper

          with open('events.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          events = data.get('events', [])
          print(f'Total events validated: {len(events)}')

          # 1. Minimum event count
          assert len(events) >= 30, f'Too few events generated ({len(events)})!'

          # 2. operational_date must match today in Europe/Lisbon operational day (04:00 rollover)
          today = scraper.get_lisbon_operational_date().isoformat()
          op_date = data.get('operational_date', '')
          assert op_date == today, (
              f'operational_date {op_date!r} does not match Lisbon today {today!r}. Stale or cached output?'
          )

          # 3. Per-event field validation
          valid_tiers = {'FREE', 'ACCESSIBLE', 'MID', 'PREMIUM', 'CONSULTAR', 'PAID_OPP'}
          for ev in events:
              url = ev.get('url', '')
              assert url.startswith('http'), f'Invalid URL in {ev}'
              assert 'facebook.com/sharer' not in url, f'Sharer URL leaked in {ev}'
              assert 38.690 <= float(ev['lat']) <= 38.805, f'Lat out of Lisbon bounds: {ev}'
              assert -9.235 <= float(ev['lng']) <= -9.085, f'Lng out of Lisbon bounds: {ev}'
              assert ev.get('title', '').strip(), f'Empty title in {ev}'
              assert ev.get('venue', '').strip(), f'Empty venue in {ev}'
              assert ev.get('priceTier') in valid_tiers, (
                  f'Unknown priceTier {ev.get(\"priceTier\")!r} in {ev}'
              )

          print('All validations passed.')
          "

      - name: Guardar events.json atualizado
        run: |
          git config user.name "Keks Passa Event Bot"
          git config user.email "keks-passa-bot@users.noreply.github.com"
          git add events.json geocode_cache.json venues.json
          if git diff --cached --quiet; then
            echo "events.json não mudou; não há commit a criar."
            exit 0
          fi
          git commit -m "chore: atualizar agenda diária do Keks Passa ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
